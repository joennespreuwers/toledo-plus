name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # Official Playwright image: Chromium + all its system libraries preinstalled, so no 10-minute apt install.
    # Keep the tag in sync with the "playwright" version in package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    timeout-minutes: 20
    steps:
      # The Playwright image may not ship git (needed by checkout + the change/tag checks); installing it takes seconds.
      - name: Ensure git
        run: command -v git >/dev/null || (apt-get update -qq && apt-get install -y -qq --no-install-recommends git ca-certificates >/dev/null)

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Docs/website-only changes don't need the extension test suite: the job still reports "test" (so the
      # required check passes) but skips the heavy steps. Anything else — or a push to main — runs everything.
      - name: What changed?
        id: scope
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [ "${{ github.event_name }}" != "pull_request" ]; then echo "full=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          files=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          echo "$files"
          if [ -z "$files" ] || echo "$files" | grep -qvE '^(docs/|website/|[^/]+\.md$|\.github/(ISSUE_TEMPLATE/|PULL_REQUEST_TEMPLATE\.md|CODEOWNERS|labels\.json))'; then
            echo "full=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only docs/website changed – skipping the extension tests."; echo "full=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # No lockfile on purpose (only one pinned devDependency), so `npm ci` is not possible.
      - name: Install dev dependencies
        if: steps.scope.outputs.full == 'true'
        run: npm install --no-audit --no-fund


      - name: Manifest is valid JSON
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8'))"

      - name: Unit tests
        if: steps.scope.outputs.full == 'true'
        run: npm run test:unit

      - name: E2E tests (headless Chromium with the extension loaded)
        if: steps.scope.outputs.full == 'true'
        run: xvfb-run --auto-servernum npm run test:e2e
        env:
          CI: "true"

      - name: Pack (smoke test)
        if: steps.scope.outputs.full == 'true'
        run: npm run pack

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: tests/artifacts/
          if-no-files-found: ignore
          retention-days: 14
