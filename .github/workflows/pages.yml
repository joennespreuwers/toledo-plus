name: Website

# Deploys website/ (toledoplus.be) to GitHub Pages.
# One-time setup: Settings → Pages → Source: "GitHub Actions" (see website/README.md).
# The demo (toledoplus.be/demo/) runs the real extension UI: its files are copied into the
# artifact at build time (never duplicated in git). website/tools/ (dev scripts) is not deployed.

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/pages.yml"
      # the demo ships the extension UI
      - "manifest.json"
      - "src/**"
      - "ui.css"
      - "page.css"
      - "icons/**"
      - "fonts/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v5

      - name: Assemble site (+ demo/ext from the extension)
        run: |
          mkdir _site
          cp -R website/. _site/
          rm -rf _site/tools _site/.screens _site/README.md _site/.gitignore _site/demo/ext
          mkdir -p _site/demo/ext
          cp -R manifest.json ui.css page.css src icons fonts _site/demo/ext/
          # The version shown on the site always follows manifest.json (no manual edits per release).
          MV=$(node -p "require('./manifest.json').version")
          find _site -maxdepth 2 -name 'index.html' -not -path '_site/demo/*' -exec sed -i -E "s/((Versie|Version) )[0-9]+\.[0-9]+\.[0-9]+/\1${MV}/g; s/(Toledo\+ )[0-9]+\.[0-9]+\.[0-9]+(<\/h3>)/\1${MV}\2/g; s/(\"softwareVersion\": \")[^\"]*(\")/\1${MV}\2/g" {} +
          # Cache-busting: GitHub Pages caches for 10 min, so a new page could load an old stylesheet/script.
          V="${GITHUB_SHA::8}"
          find _site -name '*.html' -not -path '_site/demo/ext/*' -exec sed -i -E "s#((src|href)=\"[^\"?]*\.(css|js|webp|png))\"#\1?v=${V}\"#g" {} +
          sed -i "s/__BUILD__/${V}/" _site/demo/demo.js
          # Social previews (WhatsApp, Discord, …) cache by image URL: version og:image / twitter:image too.
          find _site -name '*.html' -not -path '_site/demo/ext/*' -exec sed -i -E "s#(content=\"https://toledoplus\.be/[^\"?]*\.png)\"#\1?v=${V}\"#g" {} +

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
