<head>

<script>/* theme before first paint (shared with the site: localStorage 'tp-theme') */(function(){try{var t=localStorage.getItem('tp-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}})()</script>
<link rel="preload" as="font" type="font/woff2" href="../assets/fonts/inter-latin-wght-normal.woff2" crossorigin>
<style>
  @font-face { font-family: "Inter"; font-style: normal; font-weight: 100 900; font-display: swap; src: url("../assets/fonts/inter-latin-wght-normal.woff2") format("woff2");
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  :root { color-scheme: light dark;
    --d-bg: #F5F4F2; --d-fg: #1F2430; --d-fg-2: #5A5F6B; --d-bar: #1F2430; --d-text: #F4F5F7; --d-muted: rgba(244, 245, 247, .66); --d-link: #F5A35F;
    --d-seg: rgba(255, 255, 255, .10); --d-seg-on: #F4F5F7; --d-seg-on-text: #1F2430; --d-btn: rgba(244, 245, 247, .82); }
  :root[data-theme="dark"] { color-scheme: dark; --d-bg: #12151C; --d-fg: #F4F5F7; --d-fg-2: #A9AFBC; --d-bar: #0C0E13; }
  :root[data-theme="light"] { color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --d-bg: #12151C; --d-fg: #F4F5F7; --d-fg-2: #A9AFBC; --d-bar: #0C0E13; } }
  html { background: var(--d-bg); }
  body { margin: 0; font: 15px/1.4 "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--d-fg); }
  /* The demo bar lives in <body> (first); page.css hides every other body child while Toledo+ is on. */
  html.tplus-on body > #demo-bar#demo-bar { display: flex !important; }
  /* Loading (until the app is on) and the "classic Toledo" stand-in (demo.js) */
  #demo-loading { display: none; place-items: center; align-content: center; gap: 14px; min-height: 60vh; color: var(--d-fg-2); font-size: 15px; }
  html:not(.tplus-on):not(.demo-classic):not(.demo-failed) #demo-loading { display: grid; }
  #demo-loading .spin { width: 28px; height: 28px; border-radius: 50%; border: 3px solid color-mix(in srgb, var(--d-fg-2) 25%, transparent); border-top-color: #EE8B35; animation: demo-spin 900ms linear infinite; }
  @keyframes demo-spin { to { transform: rotate(360deg); } }
  #demo-classic { max-width: 34em; margin: 16vh auto; padding: 0 16px; text-align: center; }
  #demo-classic h1 { font-size: 26px; line-height: 1.2; letter-spacing: -.02em; margin: 0 0 12px; }
  #demo-classic p { color: var(--d-fg-2); margin: 0 0 20px; }
  #demo-classic button { appearance: none; border: 0; border-radius: 999px; min-height: 44px; padding: 10px 22px; font: 650 16px/1.2 "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #EE8B35; color: #1F2430; cursor: pointer; }
  #demo-classic button:focus-visible { outline: 2px solid #C2410C; outline-offset: 2px; }
  #demo-bar .demo-skip { position: absolute; left: 8px; top: -100px; z-index: 3; padding: 8px 14px; border-radius: 10px; background: #EE8B35; color: #1F2430 !important; }
  #demo-bar .demo-skip:focus { top: 6px; text-decoration: none; }
  /* demo bar: the brand ink strip — back to the site · what this is · install · language · theme */
  #demo-bar {
    display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 4px 10px;
    min-height: 40px; padding: 6px 12px; box-sizing: border-box;
    font: 500 13px/1.3 "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: -.005em;
    background: var(--d-bar); color: var(--d-text); border-bottom: .5px solid rgba(255, 255, 255, .08);
    position: relative; z-index: 2;
  }
  #demo-bar .demo-back { margin-right: auto; display: inline-flex; align-items: center; min-height: 28px; padding: 2px 10px 2px 6px; border-radius: 999px; color: var(--d-text); font-weight: 600; }
  #demo-bar .demo-back:hover { background: rgba(255, 255, 255, .08); text-decoration: none; }
  #demo-bar .demo-back .short { display: none; }
  #demo-bar .demo-end { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; }
  #demo-bar .demo-tag { font-weight: 600; }
  #demo-bar .demo-sep { color: var(--d-muted); }
  #demo-bar a { color: var(--d-link); font-weight: 600; text-decoration: none; }
  #demo-bar a:hover { text-decoration: underline; }
  #demo-bar .demo-langs { display: inline-flex; gap: 2px; padding: 2px; border-radius: 999px; background: var(--d-seg); }
  #demo-bar button {
    appearance: none; border: 0; background: transparent; color: var(--d-btn); font: 600 12px/1 inherit; font-family: inherit;
    min-width: 34px; min-height: 26px; padding: 0 8px; border-radius: 999px; cursor: pointer;
    transition: background-color 120ms cubic-bezier(.25, .1, .25, 1), color 120ms cubic-bezier(.25, .1, .25, 1);
  }
  #demo-bar button[aria-pressed="true"] { background: var(--d-seg-on); color: var(--d-seg-on-text); }
  #demo-bar .demo-theme { display: inline-grid; place-items: center; min-width: 28px; width: 28px; padding: 0; background: var(--d-seg); }
  #demo-bar .demo-theme svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; display: none; }
  #demo-bar .demo-theme[data-mode="light"] .ti-light, #demo-bar .demo-theme[data-mode="dark"] .ti-dark { display: block; }
  #demo-bar :focus-visible { outline: 2px solid #F5A35F; outline-offset: 2px; }
  #demo-fallback { max-width: 32em; margin: 20vh auto; padding: 0 16px; text-align: center; }
  @media (max-width: 560px) {
    #demo-bar { justify-content: space-between; }
    #demo-bar .demo-back .long { display: none; }
    #demo-bar .demo-back .short { display: inline; }
    #demo-bar .demo-mid .demo-tag, #demo-bar .demo-mid .demo-sep { display: none; }
  }
  @media (max-width: 360px) { #demo-bar { gap: 4px 6px; padding-inline: 8px; } #demo-bar button { min-width: 30px; padding: 0 6px; } }
  @media (prefers-reduced-motion: reduce) { #demo-bar button { transition: none; } #demo-loading .spin { animation-duration: 3s; } }
  @media print { #demo-bar { display: none; } }
</style>
<script src="mock.js" defer></script>
<script src="demo.js" defer></script>
</head>
<body>
<noscript><p id="demo-noscript" style="max-width:32em;margin:20vh auto;padding:0 16px;text-align:center">De demo heeft JavaScript nodig. · The demo needs JavaScript. · La démo nécessite JavaScript. <a href="../">toledoplus.be</a></p></noscript>
<p id="demo-fallback" role="alert" hidden></p>
<div id="demo-loading" role="status"><span class="spin" aria-hidden="true"></span><span class="txt">De demo wordt geladen…</span></div>
<div id="demo-classic" hidden><h1></h1><p></p><button type="button"></button></div>
</body>
</html>
