<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Toledo+ demo</title>
<meta name="description" content="Probeer Toledo+ in je browser, met nepdata. Geen installatie nodig.">
<link rel="canonical" href="https://toledoplus.be/demo/">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="icon" href="../favicon.ico" sizes="32x32">
<link rel="icon" href="../assets/icon128.png" type="image/png" sizes="128x128">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<style>
  :root { color-scheme: light dark; }
  html { background: #F2F2F7; }
  body { margin: 0; font: 15px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif; color: #1d1d1f; }
  #demo-bar {
    display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 4px 10px;
    min-height: 40px; padding: 6px 16px; box-sizing: border-box;
    font: 500 13px/1.3 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
    background: #E8F1FD; color: #1d1d1f; border-bottom: .5px solid rgba(0, 0, 0, .1);
    position: relative; z-index: 2;
  }
  #demo-bar .demo-tag { font-weight: 600; }
  #demo-bar .demo-sep { color: #6e6e73; }
  #demo-bar a { color: #0062CC; font-weight: 600; text-decoration: none; }
  #demo-bar a:hover { text-decoration: underline; }
  #demo-bar .demo-langs { display: inline-flex; gap: 2px; margin-left: 8px; padding: 2px; border-radius: 999px; background: rgba(120, 120, 128, .14); }
  #demo-bar button {
    appearance: none; border: 0; background: transparent; color: #3a3a3c; font: 600 12px/1 inherit; font-family: inherit;
    min-width: 34px; min-height: 26px; padding: 0 8px; border-radius: 999px; cursor: pointer;
  }
  #demo-bar button[aria-pressed="true"] { background: #fff; color: #1d1d1f; box-shadow: 0 1px 2px rgba(0, 0, 0, .14); }
  #demo-bar :focus-visible { outline: 2px solid #0062CC; outline-offset: 2px; }
  #demo-fallback { max-width: 32em; margin: 20vh auto; padding: 0 16px; text-align: center; }
  @media (prefers-color-scheme: dark) {
    html { background: #000; }
    body { color: #f5f5f7; }
    #demo-bar { background: #0B2440; color: #f5f5f7; border-bottom-color: rgba(255, 255, 255, .12); }
    #demo-bar .demo-sep { color: #98989d; }
    #demo-bar a { color: #4BA3FF; }
    #demo-bar button { color: #d1d1d6; }
    #demo-bar button[aria-pressed="true"] { background: #3a3a3c; color: #fff; }
    #demo-bar :focus-visible { outline-color: #4BA3FF; }
  }
  @media print { #demo-bar { display: none; } }
</style>
<script src="mock.js" defer></script>
<script src="demo.js" defer></script>
</head>
<body>
<noscript><p id="demo-noscript" style="max-width:32em;margin:20vh auto;padding:0 16px;text-align:center">De demo heeft JavaScript nodig. · The demo needs JavaScript. · La démo nécessite JavaScript. <a href="../">toledoplus.be</a></p></noscript>
<p id="demo-fallback" role="alert" hidden></p>
</body>
</html>
